AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Checkpoint Bedrock question-generation backend

Parameters:
  BedrockModelId:
    Type: String
    Default: google.gemma-3-4b-it
  BedrockFallbackModelId:
    Type: String
    Default: amazon.nova-micro-v1:0
  MaxQuestionsPerBatch:
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 40
  MaxRequestsPerInstallPerDay:
    Type: Number
    Default: 40
    MinValue: 1
  MaxRequestsPerIPPerDay:
    Type: Number
    Default: 400
    MinValue: 1
  BackendToken:
    Type: String
    Default: ""
    NoEcho: true
  AllowUnauthenticatedBackend:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

Resources:
  QuestionRateLimitTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: rateKey
          AttributeType: S
      KeySchema:
        - AttributeName: rateKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  CheckpointQuestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      CodeUri: .
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_FALLBACK_MODEL_ID: !Ref BedrockFallbackModelId
          MAX_QUESTIONS_PER_BATCH: !Ref MaxQuestionsPerBatch
          CHECKPOINT_BACKEND_TOKEN: !Ref BackendToken
          ALLOW_UNAUTHENTICATED_BACKEND: !Ref AllowUnauthenticatedBackend
          RATE_LIMIT_TABLE_NAME: !Ref QuestionRateLimitTable
          MAX_REQUESTS_PER_INSTALL_PER_DAY: !Ref MaxRequestsPerInstallPerDay
          MAX_REQUESTS_PER_IP_PER_DAY: !Ref MaxRequestsPerIPPerDay
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - "*"
          AllowHeaders:
            - authorization
            - content-type
            - x-checkpoint-install-id
          AllowMethods:
            - POST
            - OPTIONS
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt QuestionRateLimitTable.Arn

Outputs:
  QuestionEndpoint:
    Description: Function URL to use as Checkpoint's AI backend endpoint.
    Value: !GetAtt CheckpointQuestionFunctionUrl.FunctionUrl
