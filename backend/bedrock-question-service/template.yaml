AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Checkpoint Bedrock question-generation backend

Parameters:
  BedrockModelArn:
    Type: String
    Description: Exact Bedrock foundation-model or inference-profile ARN used by Converse.
  BedrockInvokeResourceArns:
    Type: CommaDelimitedList
    Description: Comma-delimited least-privilege invoke resources. Include the runtime profile/model ARN and every destination foundation-model ARN required by cross-region inference.
  BedrockFallbackModelArn:
    Type: String
    Default: ""
    Description: Optional fallback ARN. Leave empty until it passes the same eval suite.
  BedrockGuardrailIdentifier:
    Type: String
    Default: ""
    Description: Optional Bedrock Guardrail ID. Identifier and version must be set together.
  BedrockGuardrailVersion:
    Type: String
    Default: ""
    Description: Optional Bedrock Guardrail numeric version or DRAFT.
  BedrockGuardrailArn:
    Type: String
    Default: ""
    Description: Guardrail ARN used to grant bedrock:ApplyGuardrail when a guardrail is enabled.
  MaxQuestionsPerBatch:
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 40
  BedrockMaxTokens:
    Type: Number
    Default: 6000
    MinValue: 256
    MaxValue: 10000
  GenerationAttempts:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 5
  MaxProviderCallsPerRequest:
    Type: Number
    Default: 6
    MinValue: 1
    MaxValue: 20
  MaxRequestBodyBytes:
    Type: Number
    Default: 131072
    MinValue: 4096
    MaxValue: 1048576
  MaxRequestsPerInstallPerDay:
    Type: Number
    Default: 40
    MinValue: 1
  MaxRequestsPerIPPerDay:
    Type: Number
    Default: 400
    MinValue: 1
  RateLimitTTLSeconds:
    Type: Number
    Default: 172800
    MinValue: 86400
    MaxValue: 1209600
  QuestionBankTTLSeconds:
    Type: Number
    Default: 2592000
    MinValue: 86400
    MaxValue: 7776000
    Description: Nominal lifetime for server-side question-bank records. DynamoDB TTL deletion is asynchronous.
  QuotaHashSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Server-only HMAC secret for pseudonymizing install and IP quota keys.
  BackendToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: Temporary shared bearer for internal/TestFlight only; replace with App Attest before public release.
  AllowUnauthenticatedBackend:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Development-only opt-in. TestFlight and production ignore unauthenticated access.
  DeploymentEnvironment:
    Type: String
    Default: testflight
    AllowedValues:
      - development
      - testflight
      - production
  ServiceMode:
    Type: String
    Default: enabled
    AllowedValues:
      - enabled
      - drain
      - disabled
    Description: Kill switch. Drain and disabled reject generation before auth, quota, or Bedrock.
  ServiceRetryAfterSeconds:
    Type: Number
    Default: 300
    MinValue: 1
    MaxValue: 86400
  ApiStageName:
    Type: String
    Default: prod
  ApiThrottleRateLimit:
    Type: Number
    Default: 5
    MinValue: 1
  ApiThrottleBurstLimit:
    Type: Number
    Default: 10
    MinValue: 1
  ReservedConcurrency:
    Type: Number
    Default: 5
    MinValue: 1
  QuestionBankWorkerReservedConcurrency:
    Type: Number
    Default: 2
    MinValue: 1
    Description: Cost and concurrency limit for asynchronous question-bank generation.
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues:
      - 7
      - 14
      - 30
      - 60
      - 90
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional operations email. The SNS subscription must be confirmed.
  BudgetAlertEmail:
    Type: String
    Default: ""
    Description: Optional email for an account-wide Amazon Bedrock monthly budget.
  MonthlyBedrockBudgetUSD:
    Type: Number
    Default: 25
    MinValue: 1

Rules:
  GuardrailConfigurationAllOrNone:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref BedrockGuardrailIdentifier, ""]
            - !Equals [!Ref BedrockGuardrailVersion, ""]
            - !Equals [!Ref BedrockGuardrailArn, ""]
          - !And
            - !Not [!Equals [!Ref BedrockGuardrailIdentifier, ""]]
            - !Not [!Equals [!Ref BedrockGuardrailVersion, ""]]
            - !Not [!Equals [!Ref BedrockGuardrailArn, ""]]
        AssertDescription: BedrockGuardrailIdentifier, BedrockGuardrailVersion, and BedrockGuardrailArn must be provided together or all left empty.
  ProductionRequiresSafetyAndNotifications:
    RuleCondition: !Equals [!Ref DeploymentEnvironment, production]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref BedrockGuardrailIdentifier, ""]]
          - !Not [!Equals [!Ref BedrockGuardrailVersion, ""]]
          - !Not [!Equals [!Ref BedrockGuardrailArn, ""]]
          - !Not [!Equals [!Ref AlertEmail, ""]]
          - !Not [!Equals [!Ref BudgetAlertEmail, ""]]
        AssertDescription: Production requires a complete Bedrock Guardrail configuration plus operations and budget alert emails.

Conditions:
  HasGuardrailArn: !Not [!Equals [!Ref BedrockGuardrailArn, ""]]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  HasBudgetEmail: !Not [!Equals [!Ref BudgetAlertEmail, ""]]

Resources:
  QuestionRateLimitTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: rateKey
          AttributeType: S
      KeySchema:
        - AttributeName: rateKey
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  QuestionBankTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  QuestionBankDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  QuestionBankQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 345600
      VisibilityTimeout: 720
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt QuestionBankDeadLetterQueue.Arn
        maxReceiveCount: 5

  BackendApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref ApiStageName
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ApiThrottleRateLimit
        ThrottlingBurstLimit: !Ref ApiThrottleBurstLimit

  CheckpointQuestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      CodeUri: .
      Timeout: 30
      MemorySize: 256
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      Tracing: Active
      LoggingConfig:
        LogGroup: !Ref CheckpointQuestionFunctionLogGroup
        LogFormat: Text
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelArn
          BEDROCK_FALLBACK_MODEL_ID: !Ref BedrockFallbackModelArn
          BEDROCK_MAX_TOKENS: !Ref BedrockMaxTokens
          BEDROCK_GUARDRAIL_IDENTIFIER: !Ref BedrockGuardrailIdentifier
          BEDROCK_GUARDRAIL_VERSION: !Ref BedrockGuardrailVersion
          MAX_QUESTIONS_PER_BATCH: !Ref MaxQuestionsPerBatch
          GENERATION_ATTEMPTS: !Ref GenerationAttempts
          MAX_PROVIDER_CALLS_PER_REQUEST: !Ref MaxProviderCallsPerRequest
          MAX_REQUEST_BODY_BYTES: !Ref MaxRequestBodyBytes
          CHECKPOINT_BACKEND_TOKEN: !Ref BackendToken
          ALLOW_UNAUTHENTICATED_BACKEND: !Ref AllowUnauthenticatedBackend
          DEPLOYMENT_ENVIRONMENT: !Ref DeploymentEnvironment
          SERVICE_MODE: !Ref ServiceMode
          SERVICE_RETRY_AFTER_SECONDS: !Ref ServiceRetryAfterSeconds
          REQUIRE_RATE_LIMITING: "true"
          RATE_LIMIT_TABLE_NAME: !Ref QuestionRateLimitTable
          QUESTION_BANK_TABLE_NAME: !Ref QuestionBankTable
          QUESTION_BANK_QUEUE_URL: !Ref QuestionBankQueue
          QUESTION_BANK_TTL_SECONDS: !Ref QuestionBankTTLSeconds
          QUOTA_HASH_SECRET: !Ref QuotaHashSecret
          MAX_REQUESTS_PER_INSTALL_PER_DAY: !Ref MaxRequestsPerInstallPerDay
          MAX_REQUESTS_PER_IP_PER_DAY: !Ref MaxRequestsPerIPPerDay
          RATE_LIMIT_TTL_SECONDS: !Ref RateLimitTTLSeconds
          EMIT_STRUCTURED_METRICS: "true"
      Events:
        QuestionGeneration:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendApi
            Path: /v1/questions
            Method: POST
        QuestionBankEnsure:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendApi
            Path: /v1/question-banks/ensure
            Method: POST
        QuestionBankClaim:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendApi
            Path: /v1/question-banks/claim
            Method: POST
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Ref BedrockInvokeResourceArns
            - !If
              - HasGuardrailArn
              - Effect: Allow
                Action:
                  - bedrock:ApplyGuardrail
                Resource: !Ref BedrockGuardrailArn
              - !Ref AWS::NoValue
            - Effect: Allow
              Action:
                - dynamodb:TransactWriteItems
              Resource: !GetAtt QuestionRateLimitTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:TransactWriteItems
                - dynamodb:UpdateItem
              Resource: !GetAtt QuestionBankTable.Arn
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt QuestionBankQueue.Arn

  CheckpointQuestionFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /checkpoint/${AWS::StackName}/question-service
      RetentionInDays: !Ref LogRetentionDays

  QuestionBankWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: lambda_function.question_bank_worker_handler
      CodeUri: .
      Timeout: 120
      MemorySize: 256
      ReservedConcurrentExecutions: !Ref QuestionBankWorkerReservedConcurrency
      Tracing: Active
      LoggingConfig:
        LogGroup: !Ref QuestionBankWorkerFunctionLogGroup
        LogFormat: Text
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelArn
          BEDROCK_FALLBACK_MODEL_ID: !Ref BedrockFallbackModelArn
          BEDROCK_MAX_TOKENS: !Ref BedrockMaxTokens
          BEDROCK_GUARDRAIL_IDENTIFIER: !Ref BedrockGuardrailIdentifier
          BEDROCK_GUARDRAIL_VERSION: !Ref BedrockGuardrailVersion
          MAX_QUESTIONS_PER_BATCH: !Ref MaxQuestionsPerBatch
          GENERATION_ATTEMPTS: !Ref GenerationAttempts
          MAX_PROVIDER_CALLS_PER_REQUEST: !Ref MaxProviderCallsPerRequest
          MAX_REQUEST_BODY_BYTES: !Ref MaxRequestBodyBytes
          DEPLOYMENT_ENVIRONMENT: !Ref DeploymentEnvironment
          SERVICE_MODE: !Ref ServiceMode
          SERVICE_RETRY_AFTER_SECONDS: !Ref ServiceRetryAfterSeconds
          REQUIRE_RATE_LIMITING: "true"
          RATE_LIMIT_TABLE_NAME: !Ref QuestionRateLimitTable
          QUOTA_HASH_SECRET: !Ref QuotaHashSecret
          MAX_REQUESTS_PER_INSTALL_PER_DAY: !Ref MaxRequestsPerInstallPerDay
          RATE_LIMIT_TTL_SECONDS: !Ref RateLimitTTLSeconds
          QUESTION_BANK_TABLE_NAME: !Ref QuestionBankTable
          QUESTION_BANK_QUEUE_URL: !Ref QuestionBankQueue
          QUESTION_BANK_TTL_SECONDS: !Ref QuestionBankTTLSeconds
          EMIT_STRUCTURED_METRICS: "true"
      Events:
        QuestionBankJobs:
          Type: SQS
          Properties:
            Queue: !GetAtt QuestionBankQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Ref BedrockInvokeResourceArns
            - !If
              - HasGuardrailArn
              - Effect: Allow
                Action:
                  - bedrock:ApplyGuardrail
                Resource: !Ref BedrockGuardrailArn
              - !Ref AWS::NoValue
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:TransactWriteItems
                - dynamodb:UpdateItem
              Resource: !GetAtt QuestionBankTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:TransactWriteItems
                - dynamodb:UpdateItem
              Resource: !GetAtt QuestionRateLimitTable.Arn
            - Effect: Allow
              Action:
                - sqs:ChangeMessageVisibility
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
                - sqs:ReceiveMessage
                - sqs:SendMessage
              Resource: !GetAtt QuestionBankQueue.Arn

  QuestionBankWorkerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /checkpoint/${AWS::StackName}/question-bank-worker
      RetentionInDays: !Ref LogRetentionDays

  BackendAlertTopic:
    Type: AWS::SNS::Topic

  BackendAlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref BackendAlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  ApiServerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Checkpoint backend API returned repeated 5xx responses.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref BackendApi
        - Name: Stage
          Value: !Ref ApiStageName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref BackendAlertTopic

  FunctionThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Reserved concurrency or account limits are throttling question generation.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref CheckpointQuestionFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref BackendAlertTopic

  ProviderFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Bedrock or response processing failed repeatedly.
      Namespace: Checkpoint/Backend
      MetricName: ProviderFailures
      Dimensions:
        - Name: Service
          Value: QuestionGeneration
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref BackendAlertTopic

  BackendLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Question-generation p95 latency is approaching the Lambda timeout.
      Namespace: Checkpoint/Backend
      MetricName: LatencyMilliseconds
      Dimensions:
        - Name: Service
          Value: QuestionGeneration
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 25000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref BackendAlertTopic

  BackendStructuredErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Structured backend metrics reported repeated HTTP or asynchronous worker failures.
      Namespace: Checkpoint/Backend
      MetricName: Errors
      Dimensions:
        - Name: Service
          Value: QuestionGeneration
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref BackendAlertTopic

  QuestionBankQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A question-bank generation job has waited in the queue for at least 15 minutes.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt QuestionBankQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 900
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref BackendAlertTopic

  QuestionBankDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A question-bank generation job exhausted its retries and reached the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt QuestionBankDeadLetterQueue.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref BackendAlertTopic

  MonthlyBedrockBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget:
        BudgetName: !Sub ${AWS::StackName}-bedrock-monthly
        BudgetLimit:
          Amount: !Ref MonthlyBedrockBudgetUSD
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
        CostFilters:
          Service:
            - Amazon Bedrock
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref BudgetAlertEmail
              SubscriptionType: EMAIL
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: FORECASTED
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref BudgetAlertEmail
              SubscriptionType: EMAIL

Outputs:
  QuestionEndpoint:
    Description: API Gateway endpoint to configure as Checkpoint's AI backend endpoint.
    Value: !Sub https://${BackendApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${ApiStageName}/v1/questions
  QuestionBankEnsureEndpoint:
    Description: Idempotently creates or replenishes a durable asynchronous question bank.
    Value: !Sub https://${BackendApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${ApiStageName}/v1/question-banks/ensure
  QuestionBankClaimEndpoint:
    Description: Claims already-prepared questions without invoking Bedrock in the request path.
    Value: !Sub https://${BackendApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${ApiStageName}/v1/question-banks/claim
  QuestionBankTableName:
    Description: Encrypted DynamoDB table containing expiring question-bank records.
    Value: !Ref QuestionBankTable
  QuestionBankQueueUrl:
    Description: Encrypted SQS queue used for asynchronous generation jobs.
    Value: !Ref QuestionBankQueue
  QuestionBankDeadLetterQueueUrl:
    Description: Encrypted dead-letter queue for jobs that exhaust their retries.
    Value: !Ref QuestionBankDeadLetterQueue
  QuestionBankWorkerFunctionName:
    Description: Lambda function that generates queued question-bank inventory.
    Value: !Ref QuestionBankWorkerFunction
  BackendAlertTopicArn:
    Description: SNS topic used by backend operational alarms.
    Value: !Ref BackendAlertTopic
