name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/bedrock-question-service
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2

      - name: Install Ruff
        run: python -m pip install ruff==0.12.2

      - name: Lint backend Python
        run: ruff check lambda_function.py smoke_test_backend.py tests evals/checkpoint_question_eval.py

      - name: Run backend unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile backend Python modules
        run: python -m compileall -q lambda_function.py evals tests

      - name: Validate SAM template
        run: sam validate --lint --template-file template.yaml

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Scan tracked history with Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  ios-quality:
    name: iOS tests, Release build, and analysis
    # ShieldAction submenu cases require the iOS 26 SDK. macOS 15 runners
    # default to Xcode 16.4 even when newer simulator runtimes are present.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CI: "true"
      PROJECT: Checkpoint.xcodeproj
      SCHEME: Checkpoint
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Require Xcode 26 or newer
        shell: bash
        run: |
          xcodebuild -version
          xcode_major="$(xcodebuild -version | awk '/^Xcode / { split($2, parts, "."); print parts[1] }')"
          if [[ -z "$xcode_major" || "$xcode_major" -lt 26 ]]; then
            echo "Checkpoint CI requires Xcode 26 or newer for the current Screen Time API." >&2
            exit 1
          fi

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          simulator_id="$(
            xcrun simctl list devices available --json |
              python3 -c 'import json, sys; data = json.load(sys.stdin); candidates = [(runtime, device["udid"]) for runtime, devices in data["devices"].items() if ".iOS-" in runtime for device in devices if device.get("isAvailable") and device["name"].startswith("iPhone")]; print(sorted(candidates, reverse=True)[0][1] if candidates else "")'
          )"
          if [[ -z "$simulator_id" ]]; then
            echo "No available iPhone simulator was found on the runner." >&2
            exit 1
          fi
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$simulator_id" 2>/dev/null || true
          xcrun simctl bootstatus "$simulator_id" -b

      - name: Run iOS simulator tests
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-tests" \
            -resultBundlePath "$RUNNER_TEMP/CheckpointTests.xcresult" \
            -parallel-testing-enabled NO

      - name: Build Release for the simulator
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          ci_backend_token="$(openssl rand -hex 32)"
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-release" \
            CHECKPOINT_AI_BACKEND_ENDPOINT_OVERRIDE="https://ci.checkpoint.invalid/" \
            CHECKPOINT_AI_BACKEND_TOKEN_OVERRIDE="$ci_backend_token" \
            CHECKPOINT_PRIVACY_POLICY_URL_OVERRIDE="https://ci.checkpoint.invalid/privacy" \
            CHECKPOINT_SUPPORT_URL_OVERRIDE="https://ci.checkpoint.invalid/support" \
            CHECKPOINT_ALLOW_CI_PLACEHOLDER_URLS=YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Xcode static analysis
        if: ${{ !cancelled() }}
        run: |
          xcodebuild analyze \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-analysis" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload XCTest results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CheckpointTests-xcresult
          path: ${{ runner.temp }}/CheckpointTests.xcresult
          if-no-files-found: ignore
          retention-days: 14
