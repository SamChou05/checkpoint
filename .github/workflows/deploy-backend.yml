name: Deploy backend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment to use
        required: true
        type: choice
        options:
          - testflight
          - production
      confirm_deploy:
        description: Deploy after validation (leave clear for validation only)
        required: true
        default: false
        type: boolean
      run_smoke_test:
        description: After deployment, spend one Bedrock request on a redacted authenticated smoke test
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Test and validate SAM application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/bedrock-question-service
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2

      - name: Install Ruff
        run: python -m pip install ruff==0.12.2

      - name: Lint backend Python
        run: ruff check ./*.py tests evals

      - name: Run backend unit tests
        run: python -m unittest discover -s tests -v

      - name: Test deployment scripts
        run: scripts/test-deployment-scripts.sh

      - name: Compile backend Python modules
        run: python -m compileall -q ./*.py tests evals

      - name: Validate SAM template
        run: sam validate --lint --template-file template.yaml

      - name: Build SAM application
        run: sam build --template-file template.yaml

  deploy:
    name: Deploy to ${{ inputs.environment }}
    if: ${{ inputs.confirm_deploy }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: backend-${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: backend/bedrock-question-service
    env:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      SAM_STACK_NAME: ${{ vars.SAM_STACK_NAME }}
      CHECKPOINT_BACKEND_TOKEN: ${{ secrets.CHECKPOINT_BACKEND_TOKEN }}
      QUOTA_HASH_SECRET: ${{ secrets.QUOTA_HASH_SECRET }}
      BEDROCK_MODEL_ARN: ${{ vars.BEDROCK_MODEL_ARN }}
      BEDROCK_INVOKE_RESOURCE_ARNS: ${{ vars.BEDROCK_INVOKE_RESOURCE_ARNS }}
      QUESTION_BANK_WORKER_MODEL_ARN: ${{ vars.QUESTION_BANK_WORKER_MODEL_ARN || vars.BEDROCK_MODEL_ARN }}
      QUESTION_BANK_WORKER_INVOKE_RESOURCE_ARNS: ${{ vars.QUESTION_BANK_WORKER_INVOKE_RESOURCE_ARNS || vars.BEDROCK_INVOKE_RESOURCE_ARNS }}
      BEDROCK_FALLBACK_MODEL_ARN: ${{ vars.BEDROCK_FALLBACK_MODEL_ARN }}
      BEDROCK_REASONING_EFFORT: ${{ vars.BEDROCK_REASONING_EFFORT || 'low' }}
      BEDROCK_GUARDRAIL_IDENTIFIER: ${{ vars.BEDROCK_GUARDRAIL_IDENTIFIER }}
      BEDROCK_GUARDRAIL_VERSION: ${{ vars.BEDROCK_GUARDRAIL_VERSION }}
      BEDROCK_GUARDRAIL_ARN: ${{ vars.BEDROCK_GUARDRAIL_ARN }}
      BEDROCK_MAX_TOKENS: ${{ vars.BEDROCK_MAX_TOKENS || '6000' }}
      GENERATION_ATTEMPTS: ${{ vars.GENERATION_ATTEMPTS || '3' }}
      MAX_PROVIDER_CALLS_PER_REQUEST: ${{ vars.MAX_PROVIDER_CALLS_PER_REQUEST || '6' }}
      MAX_REQUEST_BODY_BYTES: ${{ vars.MAX_REQUEST_BODY_BYTES || '131072' }}
      MAX_QUESTIONS_PER_BATCH: ${{ vars.MAX_QUESTIONS_PER_BATCH || '20' }}
      MAX_REQUESTS_PER_INSTALL_PER_DAY: ${{ vars.MAX_REQUESTS_PER_INSTALL_PER_DAY || '40' }}
      MAX_REQUESTS_PER_IP_PER_DAY: ${{ vars.MAX_REQUESTS_PER_IP_PER_DAY || '400' }}
      RATE_LIMIT_TTL_SECONDS: ${{ vars.RATE_LIMIT_TTL_SECONDS || '172800' }}
      QUESTION_BANK_TTL_SECONDS: ${{ vars.QUESTION_BANK_TTL_SECONDS || '2592000' }}
      QUESTION_BANK_MAX_RECEIVE_COUNT: ${{ vars.QUESTION_BANK_MAX_RECEIVE_COUNT || '5' }}
      DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
      SERVICE_MODE: ${{ vars.SERVICE_MODE || 'enabled' }}
      SERVICE_RETRY_AFTER_SECONDS: ${{ vars.SERVICE_RETRY_AFTER_SECONDS || '300' }}
      API_STAGE_NAME: ${{ vars.API_STAGE_NAME || 'prod' }}
      API_THROTTLE_RATE_LIMIT: ${{ vars.API_THROTTLE_RATE_LIMIT || '5' }}
      API_THROTTLE_BURST_LIMIT: ${{ vars.API_THROTTLE_BURST_LIMIT || '10' }}
      RESERVED_CONCURRENCY: ${{ vars.RESERVED_CONCURRENCY || '5' }}
      QUESTION_BANK_WORKER_RESERVED_CONCURRENCY: ${{ vars.QUESTION_BANK_WORKER_RESERVED_CONCURRENCY || '2' }}
      QUESTION_BANK_WORKER_READ_TIMEOUT_SECONDS: ${{ vars.QUESTION_BANK_WORKER_READ_TIMEOUT_SECONDS || '75' }}
      QUESTION_BANK_GENERATION_CHUNK_SIZE: ${{ vars.QUESTION_BANK_GENERATION_CHUNK_SIZE || '5' }}
      LOG_RETENTION_DAYS: ${{ vars.LOG_RETENTION_DAYS || '14' }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
      BUDGET_ALERT_EMAIL: ${{ vars.BUDGET_ALERT_EMAIL }}
      MONTHLY_BEDROCK_BUDGET_USD: ${{ vars.MONTHLY_BEDROCK_BUDGET_USD || '25' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate protected deployment configuration
        shell: bash
        run: scripts/validate-deployment-config.sh

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2

      - name: Build SAM application
        run: sam build --template-file template.yaml

      - name: Deploy SAM application
        shell: bash
        run: scripts/deploy-sam.sh

      - name: Run opt-in authenticated smoke test
        if: ${{ inputs.run_smoke_test }}
        shell: bash
        run: scripts/run-deployment-smoke-test.sh
